<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>수입/지출 작성</title>

    <style>
        body {
            background-color: #f5f6fa;
            font-family: Arial, sans-serif;
        }


        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }


        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }


        /* 입력 영역 */
        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }


        /* 입력창 */
        input[type="text"],
        input[type="number"],
        input[type="date"] {

            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;
            font-size: 14px;
        }


        input:focus {
            outline: none;
            border-color: #4CAF50;
        }


        /* 라디오 */
        .radio-group {
            display: flex;
            gap: 20px;
        }


        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;

            font-weight: normal;
            color: #333;
        }


        /* 버튼 기본 */
        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #4CAF50;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }


        button:hover {
            background-color: #43a047;
        }


        /* 저장 / 조회 버튼 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }


        .btn-group button {
            flex: 1;
        }


        /* 조회 버튼 색상 */
        .btn-group button:last-child {
            background-color: #2196F3;
        }


        .btn-group button:last-child:hover {
            background-color: #1976D2;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">
        가계부 입력
    </div>


    <form action="/ledger/save" method="post">


        <div class="form-group">

            <label>
                구분
            </label>

            <div class="radio-group">

                <label>
                    <input type="radio"
                           name="type"
                           value="INCOME"
                           required>
                    수입
                </label>


                <label>
                    <input type="radio"
                           name="type"
                           value="EXPENSE"
                           required>
                    지출
                </label>

            </div>

        </div>



        <div class="form-group">

            <label for="category">
                카테고리
            </label>

            <input type="text"
                   id="category"
                   name="category"
                   placeholder="식비, 교통비, 월급 등">

        </div>



        <div class="form-group">

            <label for="amount">
                금액
            </label>

            <input type="number"
                   id="amount"
                   name="amount"
                   placeholder="금액 입력">

        </div>



        <div class="form-group">

            <label for="memo">
                메모
            </label>

            <input type="text"
                   id="memo"
                   name="memo"
                   maxlength="200"
                   placeholder="메모 입력">

        </div>



        <div class="form-group">

            <label for="recordDate">
                날짜
            </label>

            <input type="date"
                   id="recordDate"
                   name="recordDate">

        </div>



        <div class="btn-group">

            <button type="submit">
                저장
            </button>

            <button type="button"
                    onclick="location.href='/ledger/list'">
                조회하기
            </button>

        </div>


    </form>

</div>

</body>
</html>
