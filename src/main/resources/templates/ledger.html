<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>수입/지출 작성</title>

    <style>
        body {
            background-color: #f5f6fa;
            font-family: Arial, sans-serif;
        }


        .container {
            width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }


        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }


        /* 입력 영역 */
        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }


        /* 입력창 */
        input[type="text"],
        input[type="number"],
        input[type="date"] {

            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;
            font-size: 14px;
        }


        input:focus {
            outline: none;
            border-color: #4CAF50;
        }


        /* 라디오 */
        .radio-group {
            display: flex;
            gap: 20px;
        }


        .radio-group label {
            display: flex;
            align-items: center;
            gap: 5px;

            font-weight: normal;
            color: #333;
        }


        /* 버튼 기본 */
        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #4CAF50;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }


        button:hover {
            background-color: #43a047;
        }


        /* 저장 / 조회 버튼 */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }


        .btn-group button {
            flex: 1;
        }


        /* 조회 버튼 색상 */
        .btn-group button:last-child {
            background-color: #2196F3;
        }


        .btn-group button:last-child:hover {
            background-color: #1976D2;
        }
        select {
            width: 100%;
            padding: 12px;

            border: 1px solid #ddd;
            border-radius: 8px;

            box-sizing: border-box;
            font-size: 14px;

            background-color: white;
        }

        select:focus {
            outline: none;
            border-color: #4CAF50;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="title">
        가계부 입력
    </div>


    <form action="/ledger/save" method="post">


        <div class="form-group">

            <label>
                구분
            </label>

            <div class="radio-group">

                <label>
                    <input type="radio"
                           name="type"
                           value="INCOME"
                           required>
                    수입
                </label>


                <label>
                    <input type="radio"
                           name="type"
                           value="EXPENSE"
                           required>
                    지출
                </label>

            </div>

        </div>



        <div class="form-group">

            <label for="category">
                카테고리
            </label>

            <select id="category"
                    name="category"
                    required>

                <option value="">
                    먼저 수입/지출을 선택하세요
                </option>

            </select>
        </div>



        <div class="form-group">

            <label for="amount">
                금액
            </label>

            <input type="number"
                   id="amount"
                   name="amount"
                   placeholder="금액 입력">

        </div>



        <div class="form-group">

            <label for="memo">
                메모
            </label>

            <input type="text"
                   id="memo"
                   name="memo"
                   maxlength="200"
                   placeholder="메모 입력">

        </div>



        <div class="form-group">

            <label for="recordDate">
                날짜
            </label>

            <input type="date"
                   id="recordDate"
                   name="recordDate"
                   th:value="${selectedDate}">

        </div>



        <div class="btn-group">

            <button type="button"
                    onclick="location.href='/ledger/list'">
                목록가기
            </button>

            <button type="submit">
                저장
            </button>



        </div>


    </form>

</div>
<script>

    // 수입 카테고리
    const incomeCategories = [
        "월급",
        "상여금",
        "용돈",
        "이자",
        "기타수입"
    ];


    // 지출 카테고리
    const expenseCategories = [
        "식비",
        "교통비",
        "쇼핑",
        "월세",
        "공과금",
        "통신비",
        "의료비",
        "교육비",
        "문화생활",
        "생활용품",
        "보험",
        "기타지출"
    ];


    // 카테고리 select
    const categorySelect =
        document.getElementById("category");


    // 수입/지출 라디오 버튼
    const typeRadios =
        document.querySelectorAll('input[name="type"]');


    // 카테고리 변경 함수
    function updateCategories(type) {

        // 기존 카테고리 삭제
        categorySelect.innerHTML = "";


        // 기본 옵션
        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";

        defaultOption.textContent =
            "카테고리를 선택하세요";

        defaultOption.disabled = true;

        defaultOption.selected = true;

        categorySelect.appendChild(defaultOption);


        // 선택한 타입에 따라 카테고리 결정
        let categories = [];

        if (type === "INCOME") {

            categories = incomeCategories;

        } else if (type === "EXPENSE") {

            categories = expenseCategories;

        }


        // 카테고리 생성
        categories.forEach(function(category) {

            const option =
                document.createElement("option");

            option.value = category;

            option.textContent = category;

            categorySelect.appendChild(option);

        });

    }


    // 수입/지출 선택 이벤트
    typeRadios.forEach(function(radio) {

        radio.addEventListener("change", function() {

            updateCategories(this.value);

        });

    });

</script>
</body>
</html>
